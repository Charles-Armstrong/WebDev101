<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Menu Transitions</title>

<style>
body {
  font-family: Arial, sans-serif;
}

nav {
  display: flex;
  gap: 10px;
}

a {
  text-decoration: none;
  padding: 10px 15px;
  border: 2px solid #ccc;
  background-color: #eee;
  color: black;

  position: relative;
  top: 0px;

  transition:
    background-color .2s,
    border-color .2s,
    top .2s,
    box-shadow .2s;
}

/* Hover / Focus */
a:hover,
a:focus {
  background-color: #c6de89;
  border-color: #a3c058;
}

/* Click animation */
a:active {
  top: 3px;
  box-shadow: 0 1px 2px rgba(0,0,0,.5);
}
</style>

</head>

<body>

<h1>Navigation Menu</h1>

<nav>
  <a href="#">Home</a>
  <a href="#">Menu</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

</body>
</html>
